<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Base Rig Viewer</title>
<style>
:root{--bg:#12151c;--panel:#1b202b;--line:#2c3443;--fg:#e9edf4;--muted:#93a0b5;--accent:#f2a33c;color-scheme:dark}
*{box-sizing:border-box}[hidden]{display:none!important}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:14px/1.4 system-ui,sans-serif;display:grid;grid-template-rows:1fr auto}
#stage{position:relative;min-height:0;background:radial-gradient(ellipse 70% 60% at 50% 70%,#273042,#12151c 75%)}
#stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#log{position:absolute;right:max(12px,env(safe-area-inset-right,0px));top:12px;font:12px ui-monospace,monospace;color:var(--muted);text-align:right;pointer-events:none;white-space:pre}
#title{position:absolute;left:max(16px,env(safe-area-inset-left,0px));top:12px;pointer-events:none}
#title b{letter-spacing:.14em;text-transform:uppercase;font-size:12px;color:var(--accent)}#title div{color:var(--muted);font-size:12px;max-width:44ch}
#bar{background:var(--panel);border-top:1px solid var(--line);padding:10px max(16px,env(safe-area-inset-right,0px)) max(10px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center}
.grp{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.grp>span{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.08em}
button{background:#262d3b;color:var(--fg);border:1px solid var(--line);border-radius:7px;padding:7px 11px;font:inherit;cursor:pointer}
button[aria-pressed=true]{background:var(--accent);color:#1a1206;border-color:transparent;font-weight:700}
button:focus-visible{outline:2px solid #ffe2b0;outline-offset:2px}
label{display:inline-flex;gap:6px;align-items:center}input{accent-color:var(--accent)}
#err{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:24px;color:#ffb4a8}
</style></head>
<body>
<div id="stage"><canvas id="c"></canvas>
  <div id="title"><b>Base rig</b><div>Human and dwarf on one skeleton layout. Placeholder art; every piece swaps for painted art.</div></div>
  <div id="log"></div><div id="err" hidden></div></div>
<div id="bar">
  <div class="grp"><span>Weapon</span><button data-weapon="staff" aria-pressed="true">Staff</button><button data-weapon="gun" aria-pressed="false">Gun</button><button data-weapon="none" aria-pressed="false">Unarmed</button></div>
  <div class="grp"><span>Play</span><span id="anims" class="grp"></span></div>
  <div class="grp"><label><input type="checkbox" id="bones"> bones</label><label><input type="checkbox" id="slow"> slow motion</label></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@esotericsoftware/spine-webgl@4.2.73/dist/iife/spine-webgl.js"></script>
<script type="module">
import { SlotCharacter } from './slot-character.js';
const $ = (s) => document.querySelector(s);
const q = new URLSearchParams(location.search); const base = q.get('base') || '../export/';
const CHARS = [{ id: 'human', file: 'Base-Human', x: -150 }, { id: 'dwarf', file: 'Base-Dwarf', x: 190 }];
const ACTIONS = { staff: [['staff/slam', 'impact'], ['hit'], ['win']], gun: [['gun/fire', 'fire'], ['hit'], ['win']], none: [['hit'], ['win']] };
const canvas = $('#c');
try {
  const gl = canvas.getContext('webgl', { alpha: true, premultipliedAlpha: false, preserveDrawingBuffer: true }); if (!gl) throw new Error('WebGL is not available on this device.');
  const ctx = new spine.ManagedWebGLRenderingContext(gl); const renderer = new spine.SceneRenderer(canvas, ctx); const assets = new spine.AssetManager(ctx, base);
  for (const c of CHARS) { assets.loadText(`${c.id}/${c.file}.json`); assets.loadTextureAtlas(`${c.id}/${c.file}.atlas`); }
  await new Promise((res, rej) => (function wait() { if (assets.hasErrors()) rej(new Error(JSON.stringify(assets.getErrors()))); else if (assets.isLoadingComplete()) res(); else requestAnimationFrame(wait); })());
  const chars = CHARS.map((c) => { const json = new spine.SkeletonJson(new spine.AtlasAttachmentLoader(assets.require(`${c.id}/${c.file}.atlas`))); const ch = new SlotCharacter(json.readSkeletonData(assets.require(`${c.id}/${c.file}.json`))); ch.skeleton.x = c.x; ch.id = c.id; return ch; });
  const state = { weapon: 'staff', bones: false, speed: 1, paused: false }; const log = [];
  for (const ch of chars) ch.onEvent((ev, anim, t) => { log.unshift(`${ch.id}  ${anim}  ${ev} @ ${t.toFixed(3)}s`); log.length = Math.min(log.length, 6); $('#log').textContent = log.join('\n'); });
  function setWeapon(w) { state.weapon = w; for (const ch of chars) ch.setWeapon(w); document.querySelectorAll('[data-weapon]').forEach((b) => b.setAttribute('aria-pressed', b.dataset.weapon === w)); const box = $('#anims'); box.innerHTML = ''; for (const [name, until] of ACTIONS[w]) { const b = document.createElement('button'); b.textContent = name.split('/').pop(); b.onclick = () => chars.forEach((ch) => ch.play(name, { until })); box.append(b); } }
  document.querySelectorAll('[data-weapon]').forEach((b) => (b.onclick = () => setWeapon(b.dataset.weapon)));
  $('#bones').onchange = (e) => { state.bones = e.target.checked; }; $('#slow').onchange = (e) => { state.speed = e.target.checked ? 0.25 : 1; };
  function resize() { const r = canvas.getBoundingClientRect(); const dpr = Math.min(2, window.devicePixelRatio || 1); canvas.width = Math.round(r.width * dpr); canvas.height = Math.round(r.height * dpr); }
  new ResizeObserver(resize).observe(canvas); resize();
  function draw() {
    gl.viewport(0, 0, canvas.width, canvas.height); gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT);
    const viewH = 900, viewW = Math.max(viewH * canvas.width / canvas.height, 860); const zoom = viewW / canvas.width; const cam = renderer.camera;
    cam.zoom = Math.max(zoom, viewH / canvas.height); cam.position.set(20, 380, 0); cam.setViewport(canvas.width, canvas.height);
    renderer.begin(); for (const ch of chars) { renderer.drawSkeleton(ch.skeleton, false); if (state.bones) renderer.drawSkeletonDebug(ch.skeleton, false); } renderer.end();
  }
  let last = performance.now();
  function tick(now) { const dt = Math.min(0.05, (now - last) / 1000) * state.speed; last = now; if (!state.paused) for (const ch of chars) ch.update(dt); draw(); requestAnimationFrame(tick); }
  setWeapon('staff'); requestAnimationFrame(tick);
  // test hooks: deterministic stepping for headless validation
  window.Viewer = { chars, state, setWeapon, draw, step(dt) { for (const ch of chars) ch.update(dt); }, bone(id, name) { const b = chars.find((c) => c.id === id).skeleton.findBone(name); return b ? { x: b.worldX, y: b.worldY, rot: b.getWorldRotationX(), active: b.active } : null; },
    info(id) { const d = chars.find((c) => c.id === id).skeleton.data; return { bones: d.bones.length, slots: d.slots.length, skins: d.skins.map((s) => s.name), animations: d.animations.map((a) => [a.name, +a.duration.toFixed(3)]), ik: d.ikConstraints.map((c) => c.name), transform: d.transformConstraints.map((c) => c.name), events: d.events.map((e) => e.name) }; } };
} catch (e) { const el = $('#err'); el.hidden = false; el.textContent = 'Could not start the viewer: ' + e.message; console.error(e); window.ViewerError = String(e.message || e); }
</script>
</body></html>
