<!doctype html><html><head><meta charset="utf-8"><title>kit builder (headless)</title><style>html,body{margin:0;background:#fff}</style></head><body>
<script type="module">
// Headless entry used by generator/build.mjs: builds a kit and hands every file back as base64.
import { buildKit, kitFiles } from './kit.js';
const b64 = (u8) => { let s = ''; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)); return btoa(s); };
const load = (src) => new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('could not read an art image')); i.src = src; });
window.buildFiles = async (config, scale = 2, artIn = {}) => {
  const art = {}; for (const [n, a] of Object.entries(artIn)) art[n] = { ...a, image: await load(a.dataUrl) };
  const kit = buildKit(config, { scale, art }); const files = await kitFiles(kit, { art });
  return { file: kit.file, id: kit.P.id, summary: { bones: kit.json.bones.length, slots: kit.json.slots.length, pieces: kit.pieces.length, atlas: [kit.atlas.w, kit.atlas.h], animations: Object.keys(kit.json.animations).length }, files: files.map((f) => ({ name: f.name, b64: b64(f.bytes) })) };
};
window.ready = true;
</script></body></html>
