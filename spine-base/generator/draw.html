<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#fff}</style></head><body>
<script type="module">
import { PIECES, PIECE_INFO, C } from './pieces.js';

/** Template sheet: assembled setup pose with bones, plus every piece exploded with its pivot and size. */

  const Wc = 2600, Hc = Math.max(1500, Math.round(R.P.height * 1.25 * 1.6) + 200); const c = document.createElement('canvas'); c.width = Wc; c.height = Hc; const g = c.getContext('2d');
  g.fillStyle = '#eef1f5'; g.fillRect(0, 0, Wc, Hc);
  g.fillStyle = C.line; g.font = '700 34px system-ui, sans-serif'; g.fillText(`${R.P.file} — template sheet`, 40, 56);
  g.font = '18px system-ui, sans-serif'; g.fillStyle = '#44506a'; g.fillText('Left: setup pose (three-quarter, facing right) with the skeleton. Right: every piece at export size with its pivot (the bone it hangs on) marked. Paint over each piece without moving it.', 40, 88);
  // assembled
  const z = 1.6; const ox = 420, oy = Hc - 110; const X = (x) => ox + x * z, Y = (y) => oy - y * z;
  g.strokeStyle = '#b8c0cc'; g.lineWidth = 2; g.beginPath(); g.moveTo(60, oy); g.lineTo(820, oy); g.stroke();
  const order = ['upper-far', 'forearm-far', 'hand-far-back', 'staff', 'hand-far-front', 'thigh-far', 'shin-far', 'foot-far', 'pelvis', 'thigh-near', 'shin-near', 'foot-near', 'torso', 'head', 'upper-near', 'forearm-near', 'hand-near'];
  for (const n of order) { const p = by[n]; g.drawImage(p.canvas, X(p.rect.x), Y(p.rect.y + p.rect.h), p.rect.w * z, p.rect.h * z); }

    g.strokeStyle = name.includes('target') || name.startsWith('staff') ? '#e2463f' : '#1fae6b'; g.lineWidth = 3; g.beginPath(); g.moveTo(X(w.x), Y(w.y)); g.lineTo(X(ex), Y(ey)); g.stroke();

  }

  for (const n of list) {

    x += Math.max(w, 150) + 36; rowH = Math.max(rowH, h);
  }

};
window.ready = true;
</script></body></html>
